<svg width="1400" height="340" viewBox="0 0 1400 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="80" y1="170" x2="1320" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="340" rx="24" fill="#0B1220"/>
  <line x1="170" y1="170" x2="1230" y2="170" stroke="url(#line)" stroke-width="6"/>

  <g>
    <circle cx="170" cy="170" r="44" fill="#083344" stroke="#22D3EE" stroke-width="3"/>
    <text x="132" y="178" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Prompt</text>
  </g>

  <g>
    <circle cx="440" cy="170" r="44" fill="#172554" stroke="#60A5FA" stroke-width="3"/>
    <text x="404" y="178" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Routing</text>
  </g>

  <g>
    <circle cx="710" cy="170" r="44" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <text x="671" y="178" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Skill</text>
  </g>

  <g>
    <circle cx="980" cy="170" r="44" fill="#083344" stroke="#5EEAD4" stroke-width="3"/>
    <text x="939" y="178" fill="#99F6E4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Output</text>
  </g>

  <g>
    <circle cx="1230" cy="170" r="44" fill="#172554" stroke="#93C5FD" stroke-width="3"/>
    <text x="1181" y="178" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Ship/Fork</text>
  </g>

  <text x="98" y="88" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">1. Ask with intent</text>
  <text x="333" y="88" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">2. Priority matching</text>
  <text x="614" y="88" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">3. Skill executes</text>
  <text x="887" y="88" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">4. Verify quality</text>
  <text x="1150" y="88" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">5. Reuse globally</text>

  <text x="92" y="268" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Goal + context + constraints</text>
  <text x="338" y="268" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">copilot-instructions + SKILL.md</text>
  <text x="635" y="268" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">slash command for precision</text>
  <text x="905" y="268" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">check output, iterate fast</text>
  <text x="1147" y="268" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17">commit, push, fork-friendly</text>
</svg>
